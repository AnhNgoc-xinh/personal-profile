<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khôi phục mật khẩu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f8efff, #e8dcff);
            font-family: Arial, sans-serif;
            color: #33245b;
        }
        .card {
            width: min(420px, 88%);
            background: white;
            padding: 32px;
            border-radius: 22px;
            box-shadow: 0 12px 35px #7651a522;
        }
        h1 { color: #7441b5; text-align: center; }
        p { text-align: center; color: #746987; }
        label { display: block; margin: 15px 0 7px; font-weight: bold; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #ded2f5;
            border-radius: 10px;
            font-size: 15px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #7847bd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .message {
            padding: 10px;
            background: #f4edff;
            border-radius: 8px;
            margin: 12px 0;
        }
        a { color: #7441b5; }
        .back { display: block; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Quên mật khẩu?</h1>
        <p>Nhập thông tin khôi phục để đặt mật khẩu mới.</p>

        {% for message in get_flashed_messages() %}
            <div class="message">{{ message }}</div>
        {% endfor %}

        <form method="post">
            <label for="username">Tên tài khoản</label>
            <input id="username" name="username" required autocomplete="username">

            <label for="recovery_key">Mã khôi phục</label>
            <input id="recovery_key" name="recovery_key" type="password"
                   required autocomplete="off">

            <label for="new_password">Mật khẩu mới</label>
            <input id="new_password" name="new_password" type="password"
                   minlength="8" required autocomplete="new-password">

            <label for="confirm_password">Nhập lại mật khẩu mới</label>
            <input id="confirm_password" name="confirm_password" type="password"
                   minlength="8" required autocomplete="new-password">

            <button type="submit">Đặt lại mật khẩu</button>
        </form>

        <a class="back" href="{{ url_for('login') }}">← Quay lại đăng nhập</a>
    </main>
</body>
</html>
